<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Cadastre-se para ser voluntário da ONG Esperança.">

    <title>ONG Esperança | Seja Voluntário</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="cabecalho">

    <div class="container">

        <a href="index.html" class="logo">
            ONG Esperança
        </a>

        <nav aria-label="Menu principal">

            <ul>

                <li>
                    <a href="index.html">
                        Início
                    </a>
                </li>

                <li>
                    <a href="projetos.html">
                        Projetos
                    </a>
                </li>

                <li>
                    <a href="cadastro.html" aria-current="page">
                        Seja Voluntário
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>

<main>

    <section class="banner-pagina">

        <div class="container">

            <span>
                FAÇA PARTE
            </span>

            <h1>
                Seja um voluntário
            </h1>

            <p>
                Preencha o formulário e faça parte da nossa rede
                de colaboradores.
            </p>

        </div>

    </section>


    <section class="secao">

        <div class="container formulario-container">

            <form id="formCadastro">

                <fieldset>

                    <legend>
                        Dados pessoais
                    </legend>

                    <div class="campo">

                        <label for="nome">
                            Nome completo *
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            minlength="3"
                            maxlength="100"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="email">
                            E-mail *
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="cpf">
                            CPF *
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            title="Digite o CPF no formato 000.000.000-00"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="telefone">
                            Telefone *
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            maxlength="15"
                            inputmode="tel"
                            pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                            title="Digite um telefone válido"
                            required
                        >

                    </div>

                </fieldset>


                <fieldset>

                    <legend>
                        Endereço
                    </legend>

                    <div class="campo">

                        <label for="cep">
                            CEP *
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            maxlength="9"
                            inputmode="numeric"
                            pattern="[0-9]{5}-[0-9]{3}"
                            title="Digite o CEP no formato 00000-000"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="endereco">
                            Endereço *
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            autocomplete="street-address"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="cidade">
                            Cidade *
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="estado">
                            Estado *
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option>AC</option>
                            <option>AL</option>
                            <option>AP</option>
                            <option>AM</option>
                            <option>BA</option>
                            <option>CE</option>
                            <option>DF</option>
                            <option>ES</option>
                            <option>GO</option>
                            <option>MA</option>
                            <option>MT</option>
                            <option>MS</option>
                            <option>MG</option>
                            <option>PA</option>
                            <option>PB</option>
                            <option>PR</option>
                            <option>PE</option>
                            <option>PI</option>
                            <option>RJ</option>
                            <option>RN</option>
                            <option>RS</option>
                            <option>RO</option>
                            <option>RR</option>
                            <option>SC</option>
                            <option>SP</option>
                            <option>SE</option>
                            <option>TO</option>

                        </select>

                    </div>

                </fieldset>


                <fieldset>

                    <legend>
                        Engajamento
                    </legend>

                    <div class="campo">

                        <label for="area">
                            Área de interesse *
                        </label>

                        <select
                            id="area"
                            name="area"
                            required
                        >

                            <option value="">
                                Selecione uma área
                            </option>

                            <option value="educacao">
                                Educação
                            </option>

                            <option value="alimentacao">
                                Alimentação
                            </option>

                            <option value="eventos">
                                Eventos
                            </option>

                            <option value="comunicacao">
                                Comunicação
                            </option>

                            <option value="administracao">
                                Administração
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="mensagem">
                            Conte um pouco sobre você
                        </label>

                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            maxlength="500"
                        ></textarea>

                    </div>


                    <div class="aceite">

                        <input
                            type="checkbox"
                            id="termos"
                            name="termos"
                            required
                        >

                        <label for="termos">
                            Concordo com o uso dos meus dados para contato da ONG. *
                        </label>

                    </div>

                </fieldset>


                <button type="submit" class="botao">
                    Enviar cadastro
                </button>


                <p
                    id="resultado"
                    class="resultado"
                    aria-live="polite"
                ></p>

            </form>

        </div>

    </section>

</main>


<footer class="rodape">

    <div class="container">

        <p>
            &copy; 2026 ONG Esperança.
            Todos os direitos reservados.
        </p>

    </div>

</footer>


<script src="js/script.js"></script>

</body>
</html>
